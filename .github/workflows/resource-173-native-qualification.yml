name: 临时资格 · S5 native P3 close wire

# 仅独立审查和 root 放行后的唯一 publisher 一次普通 push；不修改正常 CI。
on:
  push:
    branches: [qualification/resource-173-native-run43399350863]

permissions:
  contents: read
  actions: read

concurrency:
  group: resource-173-native-run43399350863-qualification
  cancel-in-progress: false

jobs:
  qualify-native:
    name: 公开 no_defaults · 四 case 资格，不代替产品验收
    if: github.repository == 'gbcdby/boardroom'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d
      options: --init --shm-size=1g
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 固定 product 与资格增量身份
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$GITHUB_REF" = refs/heads/qualification/resource-173-native-run43399350863
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p .agent-output/resource-native-qualification/identity
          python3 scripts/qualify_resource_native.py --check-source > .agent-output/resource-native-qualification/identity/source.json
      - name: 核 run156 原 producer artifact 身份与有效性
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          contract = json.loads(Path('scripts/resource_native_qualification.json').read_text())
          dep, product = contract['dependencies'], contract['product']
          request = urllib.request.Request(
              f"https://api.github.com/repos/gbcdby/boardroom/actions/artifacts/{dep['artifactId']}",
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request, timeout=30) as response:
              artifact = json.load(response)
          assert artifact['id'] == 14018724199 and artifact['name'] == 'browser-dependencies-1'
          assert not artifact['expired'], 'run156 原依赖过期：BLOCKED，不自动重建'
          assert artifact['digest'] == 'sha256:' + dep['zipSha256']
          assert artifact['workflow_run']['id'] == product['run'] == 43385503319
          assert artifact['workflow_run']['head_sha'] == product['head']
          record = {key: artifact[key] for key in ('id', 'name', 'digest', 'expired', 'created_at', 'expires_at', 'workflow_run')}
          Path('.agent-output/resource-native-qualification/identity/artifact.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: 单次取 run156 已验证依赖，不运行 producer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          repository: gbcdby/boardroom
          run-id: 43385503319
          artifact-ids: 14018724199
          github-token: ${{ github.token }}
          path: .agent-output/browser-dependencies
          digest-mismatch: error
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.2'
      - name: 固定 ABI、锁文件和依赖 bytes，构建同一产品
        run: |
          (cd .agent-output/browser-dependencies && sha256sum --check SHA256SUMS)
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const hash = file => createHash('sha256').update(readFileSync(file)).digest('hex');
          const contract = JSON.parse(readFileSync('scripts/resource_native_qualification.json', 'utf8'));
          const dir = '.agent-output/browser-dependencies/';
          assert.equal(hash(dir + 'environment.json'), contract.dependencies.environmentSha256);
          assert.equal(hash(dir + 'node_modules.tar.gz'), contract.dependencies.tarSha256);
          const actual = {candidate: contract.product.actual, node: process.version, abi: process.versions.modules,
            platform: process.platform, arch: process.arch, libc: process.report.getReport().header.glibcVersionRuntime,
            lockSha256: hash('package-lock.json')};
          assert.deepEqual(actual, JSON.parse(readFileSync(dir + 'environment.json', 'utf8')));
          assert.deepEqual(actual, contract.dependencies.environment);
          writeFileSync('.agent-output/resource-native-qualification/identity/runtime.json', JSON.stringify(actual, null, 2) + '\n');
          JS
          tar --extract --gzip --no-same-owner --file .agent-output/browser-dependencies/node_modules.tar.gz
          npm run build
      - name: 固定公开 Python API 与原生桌面依赖
        run: |
          python3 -m virtualenv .agent-output/browser-venv
          .agent-output/browser-venv/bin/python -m pip install playwright==1.62.0 pyee==13.0.1 greenlet==3.5.6 typing-extensions==4.16.0
          export DEBIAN_FRONTEND=noninteractive
          apt-get -o Acquire::Retries=0 update
          apt-get -o Acquire::Retries=0 install -y --no-install-recommends openbox=3.6.1-12build5 x11-utils=7.7+6build2
          command -v Xvfb openbox xprop xauth
          dpkg-query -W -f='${Package}\t${Version}\n' xvfb openbox x11-utils xauth > .agent-output/resource-native-qualification/identity/packages.tsv
      - name: 一次 baseline/candidate 双宽，原期限与断言
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: .agent-output/browser-venv/bin/python scripts/qualify_resource_native.py
      - name: 保存四 case 原结果、真实身份与收尾
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resource-173-native-qualification-${{ github.run_attempt }}
          path: .agent-output/resource-native-qualification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
