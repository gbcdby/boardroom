[defaults]
base_features = none
default_mntopts = acl,user_xattr
enable_periodic_fsck = 0
blocksize = 4096
inode_size = 256
inode_ratio = 16384
lazy_itable_init = false
lazy_journal_init = false
discard = false
force_undo = 0

[fs_types]
ext4 = {
    features = none
}
brd64 = {
    blocksize = 4096
    inode_size = 256
    inode_ratio = 16384
    lazy_itable_init = false
    lazy_journal_init = false
    discard = false
    force_undo = 0
}
